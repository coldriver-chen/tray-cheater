<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王强万岁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .markdown-content pre {
            background-color: #f3f4f6;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        .markdown-content code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.875em;
            background-color: #f3f4f6;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
        }
        .markdown-content pre code {
            padding: 0;
            background-color: transparent;
        }
        .markdown-content p {
            margin: 0.5rem 0;
        }
        .markdown-content h1, .markdown-content h2, .markdown-content h3,
        .markdown-content h4, .markdown-content h5, .markdown-content h6 {
            font-weight: 600;
            margin: 1rem 0 0.5rem 0;
        }
        .markdown-content ul, .markdown-content ol {
            padding-left: 1.5rem;
            margin: 0.5rem 0;
        }
        .markdown-content blockquote {
            border-left: 4px solid #e5e7eb;
            padding-left: 1rem;
            margin: 0.5rem 0;
            color: #4b5563;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-2">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <header class="bg-blue-500 p-3">
            <h1 class="text-xl font-bold text-white text-center">王强万岁</h1>
        </header>
        
        <div class="p-2">
            <div id="messages" class="space-y-2 h-[65vh] overflow-y-auto mb-3 p-2 bg-gray-50 rounded-lg"></div>
            <div class="flex gap-2">
                <button id="connectBtn" onclick="connectWebSocket()" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-3 rounded-lg transition duration-300 active:transform active:scale-95 text-sm">
                    连接
                </button>
                <button onclick="clearMessage()" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-3 rounded-lg transition duration-300 active:transform active:scale-95 text-sm">清屏</button>
                <button onclick="closeConnection()" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-3 rounded-lg transition duration-300 active:transform active:scale-95 text-sm">关闭连接</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;

        function connectWebSocket() {
            const connectBtn = document.getElementById('connectBtn');
            connectBtn.disabled = true;
            connectBtn.textContent = '连接中...';
            connectBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
            connectBtn.classList.add('bg-blue-500', 'hover:bg-blue-600');

            // 创建 WebSocket 连接
            ws = new WebSocket('ws://' + location.host + '/websocket');

            ws.onopen = function(event) {
                connectBtn.textContent = '已连接';
                connectBtn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
                connectBtn.classList.add('bg-green-500', 'hover:bg-green-600');
                connectBtn.disabled = false;
                
                // 显示连接成功提示
                const messageContainer = document.createElement('div');
                messageContainer.className = 'bg-green-100 p-2 rounded-lg border border-green-200';
                messageContainer.innerHTML = '<p class="text-green-700 text-sm">✅ 连接成功！</p>';
                messagesDiv.appendChild(messageContainer);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            };

            ws.onmessage = function(event) {
                const messageContainer = document.createElement('div');
                messageContainer.className = 'bg-white p-2 rounded-lg shadow-sm border border-gray-200';
                
                const messageContent = document.createElement('div');
                messageContent.className = 'markdown-content';
                messageContent.innerHTML = marked.parse(event.data);
                
                messageContainer.appendChild(messageContent);
                messagesDiv.appendChild(messageContainer);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            };

            ws.onerror = function(event) {
                connectBtn.textContent = '连接失败';
                connectBtn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
                connectBtn.classList.add('bg-red-500', 'hover:bg-red-600');
                connectBtn.disabled = false;
                
                // 显示连接失败提示
                const messageContainer = document.createElement('div');
                messageContainer.className = 'bg-red-100 p-2 rounded-lg border border-red-200';
                messageContainer.innerHTML = '<p class="text-red-700 text-sm">❌ 连接失败，请检查服务器是否运行！</p>';
                messagesDiv.appendChild(messageContainer);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            };

            ws.onclose = function(event) {
                connectBtn.textContent = '连接';
                connectBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
                connectBtn.classList.add('bg-green-500', 'hover:bg-green-600');
                connectBtn.disabled = false;
                
                // 如果不是用户主动关闭，则显示提示
                if (event.code !== 1000) {
                    const messageContainer = document.createElement('div');
                    messageContainer.className = 'bg-yellow-100 p-2 rounded-lg border border-yellow-200';
                    messageContainer.innerHTML = '<p class="text-yellow-700 text-sm">⚠️ 连接已关闭 (代码: ' + event.code + ')</p>';
                    messagesDiv.appendChild(messageContainer);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
            };
        }

        function clearMessage() {
            messagesDiv.innerHTML = '';
        }

        function closeConnection() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close(1000, "用户主动关闭");
                // 显示连接已关闭的消息
                const messageContainer = document.createElement('div');
                messageContainer.className = 'bg-yellow-100 p-2 rounded-lg border border-yellow-200';
                messageContainer.innerHTML = '<p class="text-yellow-700 text-sm">连接已关闭</p>';
                messagesDiv.appendChild(messageContainer);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }
        const messagesDiv = document.getElementById('messages');
    </script>
</body>
</html>
